<main class="page-shell">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
        <li class="breadcrumb-item active">Register</li>
      </ol>
    </nav>

    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3">Register</h1>
            <p class="text-secondary">Create a local player account.</p>

            <div *ngIf="message" class="alert" [class.alert-success]="success" [class.alert-danger]="!success">{{ message }}</div>

            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid" formControlName="name">
                <div class="invalid-feedback">Name must be at least 3 characters.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid" formControlName="email">
                <div class="invalid-feedback">Enter a valid email.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid" formControlName="password">
                <div class="invalid-feedback">Password must be at least 4 characters.</div>
              </div>

              <button class="btn btn-box w-100" type="submit">Register</button>
            </form>

            <p class="mt-3 mb-0">Already have account? <a routerLink="/login">Login</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
